name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The Android SDK and ANDROID_HOME are preinstalled on ubuntu-latest runners; AGP
      # downloads any missing platform/build-tools on demand, so no SDK setup step is needed.
      - name: Build debug APK and run lint
        run: ./gradlew assembleDebug lintDebug --warning-mode all

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: build/reports/lint-results-debug.html
          if-no-files-found: ignore
